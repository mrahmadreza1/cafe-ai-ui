<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تولید QR میزها</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --saffron:#C6902E;
    --saffron-dim:#A97A24;
    --herb:#5F7047;
    --ink:#241E14;
    --text-dim:#8C8060;
    --line:#E4DAC4;
    --card:#FFFFFF;
    --bg:#F6F1E4;
    --on-saffron:#FFFBF2;
    --pad: clamp(14px, 4vw, 32px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Vazirmatn', sans-serif;
    background:var(--bg);
    color:var(--ink);
    margin:0;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }

  /* ---------- toolbar (sticky, edge-to-edge, no card frame) ---------- */
  .toolbar{
    position:sticky; top:0; z-index:10;
    background:rgba(246,241,228,.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding: max(env(safe-area-inset-top), 16px) var(--pad) 14px;
    display:flex; flex-direction:column; gap:12px;
  }
  .toolbar-top{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .toolbar-top h1{font-size:clamp(17px,2.6vw,20px); font-weight:800; letter-spacing:-0.2px;}
  .toolbar-top .sub{color:var(--text-dim); font-size:12.5px; font-weight:500; margin-top:2px;}
  .print-btn{
    flex-shrink:0; width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
    background:var(--card); font-size:16px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s, transform .1s, border-color .15s;
  }
  .print-btn:hover{border-color:var(--saffron-dim);}
  .print-btn:active{transform:scale(.94);}

  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;
  }
  .field{display:flex; flex-direction:column; gap:5px; flex:1 1 200px; min-width:0;}
  .field.narrow{flex:0 1 92px; min-width:76px;}
  .field label{font-size:11.5px; font-weight:700; color:var(--text-dim);}
  .field input{
    font-family:inherit;
    font-size:14px;
    padding:11px 13px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    width:100%;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{
    outline:none; border-color:var(--saffron);
    box-shadow:0 0 0 3px rgba(198,144,46,.16);
  }
  .btn{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    padding:11px 22px;
    border-radius:10px;
    border:none;
    background:var(--saffron);
    color:var(--on-saffron);
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, transform .1s;
    flex-shrink:0;
  }
  .btn:hover{background:var(--saffron-dim);}
  .btn:active{transform:scale(.97);}

  /* ---------- main content (fills remaining screen, no boxed frame) ---------- */
  main{
    flex:1;
    padding: 20px var(--pad) max(env(safe-area-inset-bottom), 28px);
  }
  .count-line{
    font-size:12.5px; color:var(--text-dim); margin-bottom:14px; font-weight:600;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
    gap:clamp(10px, 2vw, 18px);
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:16px 12px 14px;
    text-align:center;
    box-shadow:0 1px 2px rgba(36,30,20,.05), 0 6px 16px rgba(36,30,20,.05);
    animation:rise .28s ease backwards;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .card .qr-box{
    display:flex; justify-content:center; margin-bottom:10px;
    background:#fff; border-radius:10px; padding:8px;
  }
  .card .qr-box img, .card .qr-box canvas{ max-width:100%; height:auto; }
  .card .table-name{font-size:14.5px; font-weight:800; margin-bottom:2px;}
  .card .hint{font-size:11px; color:var(--text-dim); margin-bottom:8px;}
  .card .copy-btn{
    width:100%; border:1px dashed var(--line); background:transparent; border-radius:8px;
    padding:7px 8px; font-size:10.5px; color:var(--text-dim); font-family:inherit;
    cursor:pointer; word-break:break-all; line-height:1.5; transition:border-color .15s, color .15s, background .15s;
  }
  .card .copy-btn:hover{border-color:var(--saffron-dim); color:var(--saffron-dim); background:#FBF3E3;}
  .card .copy-btn:active{transform:scale(.98);}

  .empty{
    text-align:center; color:var(--text-dim); font-size:13px; padding:60px 20px;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:600;
    padding:10px 18px; border-radius:100px; opacity:0; pointer-events:none;
    transition:opacity .22s, transform .22s; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- responsive: laptop / wide screens ---------- */
  @media (min-width: 860px){
    .toolbar{ flex-direction:row; align-items:center; padding-top:16px; padding-bottom:16px; }
    .toolbar-top{ flex-shrink:0; }
    .controls{ flex-wrap:nowrap; flex:1; }
    .field{ flex:0 1 240px; }
    .field.narrow{ flex:0 1 88px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); }
  }

  @media print{
    body{background:#fff;}
    .toolbar, .no-print{display:none !important;}
    main{padding:0;}
    .grid{grid-template-columns:repeat(3, 1fr); gap:10px;}
    .card{box-shadow:none; border:1px dashed #ccc; animation:none;}
  }
</style>
</head>
<body>

<div class="toolbar no-print">
  <div class="toolbar-top">
    <div>
      <h1>تولید QR میزها</h1>
      <div class="sub">هر میز یک لینک اختصاصی می‌گیره — با اسکن، منوی همون میز باز میشه</div>
    </div>
    <button class="print-btn" onclick="window.print()" title="چاپ همه" aria-label="چاپ همه">🖨️</button>
  </div>
  <div class="controls">
    <div class="field">
      <label>آدرس پایه</label>
      <input id="baseUrl" value="https://cafe-ui.com/t/">
    </div>
    <div class="field narrow">
      <label>از میز</label>
      <input id="fromTable" type="number" value="1" min="1">
    </div>
    <div class="field narrow">
      <label>تا میز</label>
      <input id="toTable" type="number" value="12" min="1">
    </div>
    <button class="btn" onclick="generateAll()">تولید QR</button>
  </div>
</div>

<main>
  <div class="count-line" id="countLine"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="toast" id="toast"></div>

<script>
function makeToken(tableNum){
  // در دنیای واقعی: توکن امن سمت بک‌اند تولید و به شماره میز/سشن متصل می‌شود
  return 'tbl' + String(tableNum).padStart(3, '0');
}

function toPersianDigits(n){
  const map = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(n).split('').map(d => map[d] ?? d).join('');
}

let toastTimer;
function showToast(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

function copyLink(url, btn){
  const done = () => {
    const original = btn.textContent;
    btn.textContent = '✓ کپی شد';
    showToast('لینک کپی شد');
    setTimeout(() => { btn.textContent = original; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(done);
  } else {
    done();
  }
}

function generateAll(){
  const base = document.getElementById('baseUrl').value.trim();
  const from = Math.max(1, parseInt(document.getElementById('fromTable').value, 10) || 1);
  const to = Math.max(from, parseInt(document.getElementById('toTable').value, 10) || from);
  const grid = document.getElementById('grid');
  const countLine = document.getElementById('countLine');
  grid.innerHTML = '';

  const total = to - from + 1;
  countLine.textContent = total > 0 ? `${toPersianDigits(total)} میز` : '';

  for(let i = from; i <= to; i++){
    const token = makeToken(i);
    const fullUrl = base + token;

    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (Math.min(i - from, 24) * 18) + 'ms';
    card.innerHTML = `
      <div class="qr-box" id="qr-${i}"></div>
      <div class="table-name">میز ${toPersianDigits(i)}</div>
      <div class="hint">اسکن کنید و سفارش بدید</div>
      <button class="copy-btn" type="button">${fullUrl}</button>
    `;
    grid.appendChild(card);

    card.querySelector('.copy-btn').addEventListener('click', function(){
      copyLink(fullUrl, this);
    });

    new QRCode(document.getElementById('qr-' + i), {
      text: fullUrl,
      width: 140,
      height: 140,
      colorDark: '#241E14',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  if(total <= 0){
    grid.innerHTML = '<div class="empty">بازه‌ی میز رو درست وارد کنید 🌿</div>';
  }
}

['baseUrl','fromTable','toTable'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if(e.key === 'Enter') generateAll();
  });
});

generateAll();
</script>

</body>
</html>
